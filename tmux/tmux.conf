# ~/.tmux.conf  (reload with: prefix r)

# --- Prefix: Ctrl-a instead of Ctrl-b ----------------------------------------
# Press Ctrl-a twice to send a literal Ctrl-a (e.g. beginning of line in bash).
# Delete these three lines to go back to the default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General -----------------------------------------------------------------
set -g mouse on                 # click panes/windows, drag borders, scroll
set -g history-limit 50000
set -sg escape-time 10          # no lag after Esc in vim
set -g focus-events on
set -g display-time 2000
set -g base-index 1             # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window
setw -g automatic-rename on
set -g set-titles on
set -g set-clipboard on         # copy to system clipboard via OSC 52 (works over ssh)
set -gq allow-passthrough on    # image previews in yazi (tmux >= 3.3)

# --- Colours -----------------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc,xterm-*:Tc"

# --- Keys --------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing (hold prefix, repeat H/J/K/L).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching: prefix Ctrl-h / Ctrl-l.
bind -r C-h previous-window
bind -r C-l next-window

# Copy mode: prefix [ , then v to select, y to copy, Ctrl-v for block select.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# --- Status bar --------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e2030,fg=#c8d3f5"
set -g status-left-length 40
set -g status-left "#[fg=#1e2030,bg=#82aaff,bold] #S #[default] "
set -g status-right "#[fg=#828bb8]#h  #[fg=#c8d3f5]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e2030,bg=#c099ff,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#2f334d,fg=#c8d3f5"
