# ~/.tmux.conf  (reload with: prefix r)

# --- Prefix: Ctrl-a instead of Ctrl-b ----------------------------------------
# Press Ctrl-a twice to send a literal Ctrl-a (e.g. beginning of line in bash).
# Delete these three lines to go back to the default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Popups: g lazygit, y yazi, t scratch shell -------------------------------
# While a popup is open, the panes behind it get a darker Solarized background
# and faded default text, like a modal overlay. (The dim= style attribute has
# no effect on pane contents.) Coloured text keeps its colour. The popup's
# command unsets the overlay when it exits.
set -g @popup-overlay \
  "bg=#{?#{==:#{client_theme},dark},#001f27,#e4ddc8},fg=#{?#{==:#{client_theme},dark},#586e75,#93a1a1}"

# lazygit and yazi open in the current pane's folder.
bind g set -wF window-style "#{E:@popup-overlay}" \; \
  display-popup -E -d '#{pane_current_path}' -w 90% -h 90% \
    'lazygit; tmux set -wu window-style'
bind y set -wF window-style "#{E:@popup-overlay}" \; \
  display-popup -E -d '#{pane_current_path}' -w 90% -h 90% \
    'yazi; tmux set -wu window-style'

# A shell in a persistent "scratch" session: closing the popup (prefix t again)
# keeps it running with its history and folder for next time. It starts in the
# current pane's folder the first time; `exit` ends it. Replaces clock-mode.
bind t if -F '#{==:#{session_name},scratch}' 'detach-client' {
  set -wF window-style "#{E:@popup-overlay}"
  display-popup -E -d '#{pane_current_path}' -w 80% -h 80% \
    'TMUX= tmux new-session -A -s scratch \; set -t scratch status off; tmux set -wu window-style'
}

# --- General -----------------------------------------------------------------
set -g mouse on                 # click panes/windows, drag borders, scroll
set -g history-limit 50000
set -sg escape-time 10          # no lag after Esc in vim
set -g focus-events on
set -g display-time 2000
set -g base-index 1             # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window
setw -g automatic-rename on
set -g set-titles on
set -g set-clipboard on         # copy to system clipboard via OSC 52 (works over ssh)
set -gq allow-passthrough on    # image previews in yazi (tmux >= 3.3)

# --- Colours -----------------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc,xterm-*:Tc"

# --- Keys --------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing (hold prefix, repeat H/J/K/L).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching: prefix Ctrl-h / Ctrl-l.
bind -r C-h previous-window
bind -r C-l next-window

# Copy mode: prefix [ , then v to select, y to copy, Ctrl-v for block select.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copies also go to the local system clipboard through copy-command (tmux >= 3.2).
# OSC 52 (set-clipboard above) still covers ssh sessions with no clipboard tool.
if-shell 'command -v pbcopy' 'set -s copy-command "pbcopy"' \
  "if-shell '[ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy' 'set -s copy-command \"wl-copy\"' \
    \"if-shell '[ -n \\\"\$DISPLAY\\\" ] && command -v xclip' 'set -s copy-command \\\"xclip -in -selection clipboard\\\"'\""

# --- Status bar --------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
# Terminal palette colours only, so the bar follows Ghostty's light/dark theme.
# Solarized keeps black/white the same in both modes; only default fg/bg flip,
# so neutrals use default and brightblue (grey in both).
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-left "#[fg=brightwhite,bg=blue,bold] #S #[default] "
set -g status-right "#[fg=brightblue]#h  #[default]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=brightwhite,bg=magenta,bold] #I:#W "
set -g pane-border-style "fg=brightblue"
set -g pane-active-border-style "fg=blue"
set -g message-style "fg=brightwhite,bg=blue"
# Popups (prefix g) default to a fixed dark grey, which washes out lazygit on
# the light theme; use the terminal's own background instead.
set -g popup-style "default"
set -g popup-border-style "fg=blue"

# --- Plugins (TPM) -----------------------------------------------------------
# install.sh clones TPM (pinned there) and installs these at the tag after
# '#'; bump a tag and re-run install.sh to upgrade. By hand: prefix I
# installs, prefix Alt-u removes plugins no longer listed.
set -g @plugin 'tmux-plugins/tpm'

# prefix Ctrl-s saves all sessions, prefix Ctrl-r restores them.
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Keep this last.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
